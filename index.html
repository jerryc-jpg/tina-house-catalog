<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    ============================================================
    EDIT STORE INFO:
      - Translatable copy lives in js/i18n.js (title.home,
        brand.tagline, hero.hours, home.featured_title, etc.).
      - Featured products are pulled from products.json entries
        that have "featured": true. Toggle that flag to add or
        remove a product from the home page.
      - Brand logos come from brands.json + images/brands/.
      - Non-translated items to edit here: the .logo wordmark.
    ============================================================
  -->
  <title data-i18n="title.home">Tina House — 邻家美妆小铺</title>
  <meta name="description" content="Tina House 是一家邻里经营的化妆品小铺，精选彩妆、护肤与护发产品。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">Tina House</a>
      <nav id="site-nav" class="site-nav" aria-label="Primary">
        <a href="index.html" data-i18n="nav.home">首页</a>
        <a href="makeup.html" data-i18n="nav.makeup">彩妆</a>
        <a href="skincare.html" data-i18n="nav.skincare">护肤</a>
        <a href="haircare.html" data-i18n="nav.haircare">护发</a>
        <a href="brands.html" data-i18n="nav.brands">品牌</a>
        <a href="visit.html" data-i18n="nav.visit">地址</a>
      </nav>
      <div class="header-actions">
        <button class="lang-toggle" type="button" data-lang-toggle data-i18n-aria="toggle.aria" aria-label="切换到英文">
          <span data-i18n="toggle.switch_to">EN</span>
        </button>
        <button class="nav-toggle" type="button" data-i18n-aria="nav.toggle_aria" aria-label="切换菜单" aria-expanded="false" aria-controls="site-nav">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>Tina House</h1>
        <p class="tagline" data-i18n="brand.tagline">邻家美妆小铺。</p>
        <p class="hours" data-i18n="hero.hours">每日营业 上午10点 – 晚上7点</p>
      </div>
    </section>

    <section class="featured">
      <div class="container">
        <h2 class="section-title" data-i18n="home.featured_title">本月精选</h2>
        <!-- Featured products: any entry in products.json with "featured": true. -->
        <div class="product-grid" data-featured-grid aria-live="polite">
          <p class="loading" data-i18n="cat.loading">正在加载商品…</p>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="logo">Tina House</p>
      <p><a href="https://www.google.com/maps/search/?api=1&amp;query=41-40+Kissena+Boulevard%2C+Flushing%2C+NY+11355" target="_blank" rel="noopener" data-i18n="footer.address">41-40 Kissena Boulevard, Flushing, NY 11355</a></p>
      <p><a href="tel:+16468241388" data-i18n="footer.phone">(646) 824-1388</a></p>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
