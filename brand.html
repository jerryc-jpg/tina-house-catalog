<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    Dynamic brand page. Reads ?brand=<slug> from the URL and renders:
      - brand name (h1)
      - brand logo (from brands.json, if the slug matches an entry)
      - grid of all products whose `brand` matches (bilingual field).
    js/catalog.js does the work; no per-brand HTML is needed.
  -->
  <title data-i18n="title.brand">品牌 — Tina House</title>
  <meta name="description" content="Tina House 的品牌选品。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">Tina House</a>
      <nav id="site-nav" class="site-nav" aria-label="Primary">
        <a href="index.html" data-i18n="nav.home">首页</a>
        <a href="makeup.html" data-i18n="nav.makeup">彩妆</a>
        <a href="skincare.html" data-i18n="nav.skincare">护肤</a>
        <a href="haircare.html" data-i18n="nav.haircare">护发</a>
        <a href="brands.html" data-i18n="nav.brands">品牌</a>
        <a href="visit.html" data-i18n="nav.visit">地址</a>
      </nav>
      <div class="header-actions">
        <button class="lang-toggle" type="button" data-lang-toggle data-i18n-aria="toggle.aria" aria-label="切换到英文">
          <span data-i18n="toggle.switch_to">EN</span>
        </button>
        <button class="nav-toggle" type="button" data-i18n-aria="nav.toggle_aria" aria-label="切换菜单" aria-expanded="false" aria-controls="site-nav">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="page-header" data-brand-page>
      <div class="container">
        <h1 data-brand-name data-i18n="brand.heading_fallback">品牌</h1>
        <img class="brand-page-logo" data-brand-logo alt="" hidden>
      </div>
    </section>

    <section class="products">
      <div class="container">
        <div class="product-grid" data-brand-page-products aria-live="polite">
          <p class="loading" data-i18n="cat.loading">正在加载商品…</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="logo">Tina House</p>
      <p><a href="https://www.google.com/maps/search/?api=1&amp;query=41-40+Kissena+Boulevard%2C+Flushing%2C+NY+11355" target="_blank" rel="noopener" data-i18n="footer.address">41-40 Kissena Boulevard, Flushing, NY 11355</a></p>
      <p><a href="tel:+16468241388" data-i18n="footer.phone">(646) 824-1388</a></p>
    </div>
  </footer>

  <!-- Category panel (mobile only) -->
  <div class="cat-panel" id="cat-panel" aria-hidden="true">
    <a href="makeup.html" class="cat-panel-item" data-i18n="nav.makeup">彩妆</a>
    <a href="skincare.html" class="cat-panel-item" data-i18n="nav.skincare">护肤</a>
    <a href="haircare.html" class="cat-panel-item" data-i18n="nav.haircare">护发</a>
  </div>
  <div class="cat-panel-backdrop" data-cat-backdrop></div>

  <!-- Bottom navigation (mobile only) -->
  <nav class="bottom-nav" aria-label="移动端导航">
    <a href="index.html" class="bottom-nav-item">
      <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1z"/><path d="M9 21V13h6v8"/></svg>
      <span data-i18n="nav.home">首页</span>
    </a>
    <button class="bottom-nav-item" type="button" data-cat-toggle aria-expanded="false" aria-controls="cat-panel">
      <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>
      <span data-i18n="nav.categories">分类</span>
    </button>
    <a href="brands.html" class="bottom-nav-item is-active">
      <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7" stroke-width="2.5"/></svg>
      <span data-i18n="nav.brands">品牌</span>
    </a>
    <a href="visit.html" class="bottom-nav-item">
      <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span data-i18n="nav.visit">地址</span>
    </a>
  </nav>

  <script src="js/i18n.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
